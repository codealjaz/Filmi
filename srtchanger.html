
<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRT Changer</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 35px 16px;
    background: #101319;
    color: #edf1f7;
    font-family: system-ui, sans-serif;
}

.container {
    max-width: 800px;
    margin: 40px auto;
}

h1 { font-size: 30px; margin-bottom: 8px; }

.subtitle {
    color: #9ba7b7;
    font-size: 14px;
}

.panel {
    background: #1b2029;
    border: 1px solid #343d4b;
    border-radius: 12px;
    padding: 22px;
    margin-top: 20px;
}

.dropzone {
    border: 2px dashed #46566b;
    border-radius: 10px;
    padding: 35px 15px;
    text-align: center;
    cursor: pointer;
}

.dropzone:hover, .dropzone.dragover {
    border-color: #61a5ff;
    background: #202c3d;
}

.symbol { font-size: 36px; margin-bottom: 10px; }

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: #2879d8;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 18px;
}

button:hover:not(:disabled) { background: #398ce9; }
button:disabled { opacity: .4; cursor: not-allowed; }

.fileinfo, .details {
    color: #9ba7b7;
    font-size: 13px;
    margin-top: 12px;
    overflow-wrap: anywhere;
}

.status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    background: #252c37;
    font-size: 14px;
}

.success { color: #49d69b; }
.error { color: #ff8585; }

textarea {
    width: 100%;
    min-height: 350px;
    resize: vertical;
    background: #11161e;
    color: #cbd8e9;
    border: 1px solid #343d4b;
    border-radius: 8px;
    padding: 15px;
    font: 13px/1.6 monospace;
    white-space: pre;
}

.section-title {
    font-size: 16px;
    font-weight: 650;
    margin-bottom: 15px;
}

footer {
    text-align: center;
    color: #718096;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>
<div class="container">

<h1>🕷 SRT Changer</h1>
<div class="subtitle">Samodejno popravljanje kodiranja podnapisov</div>

<div class="panel">

    <div class="section-title">Izberi podnapise</div>

    <div class="dropzone" id="dropzone">
        <div class="symbol">📄</div>
        <strong>Izberi SRT datoteko</strong>
        <p class="subtitle">Klikni ali povleci datoteko sem</p>
        <input type="file" id="fileInput" accept=".srt" hidden>
    </div>

    <div class="fileinfo" id="fileInfo">
        Datoteka še ni izbrana.
    </div>

    <button id="convertBtn" disabled>
        ⚡ Pretvori in prenesi
    </button>

    <div class="status" id="status">
        Čakam na datoteko ...
    </div>

    <div class="details" id="details"></div>

</div>

<div class="panel">

    <div class="section-title">Predogled pretvorjenih podnapisov</div>

    <textarea id="preview"
        spellcheck="false"
        placeholder="Tukaj bo prikazan rezultat pretvorbe ..."></textarea>

</div>

<footer>
    Windows-1250 → UTF-8 · Lokalna obdelava
</footer>

</div>

<script>

const fileInput = document.getElementById("fileInput");
const dropzone = document.getElementById("dropzone");
const fileInfo = document.getElementById("fileInfo");
const convertBtn = document.getElementById("convertBtn");
const status = document.getElementById("status");
const details = document.getElementById("details");
const preview = document.getElementById("preview");

let selectedFile = null;

function showStatus(message, type = "") {
    status.className = "status " + type;
    status.textContent = message;
}

function loadFile(file) {
    if (!file.name.toLowerCase().endsWith(".srt")) {
        showStatus("Izberi SRT datoteko.", "error");
        return;
    }

    selectedFile = file;

    fileInfo.textContent =
        file.name + " · " + (file.size / 1024).toFixed(1) + " KB";

    preview.value = "";
    details.textContent = "";

    convertBtn.disabled = false;

    showStatus("Datoteka je pripravljena.");
}

dropzone.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", e => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
});

dropzone.addEventListener("dragover", e => {
    e.preventDefault();
    dropzone.classList.add("dragover");
});

dropzone.addEventListener("dragleave", () => {
    dropzone.classList.remove("dragover");
});

dropzone.addEventListener("drop", e => {
    e.preventDefault();
    dropzone.classList.remove("dragover");

    if (e.dataTransfer.files[0]) {
        loadFile(e.dataTransfer.files[0]);
    }
});

// Windows-1250 -> UTF-8
convertBtn.addEventListener("click", async () => {

    if (!selectedFile) return;

    convertBtn.disabled = true;

    try {
        showStatus("Pretvarjam podnapise ...");

        const buffer = await selectedFile.arrayBuffer();

        // Vedno beremo original kot Windows-1250.
        let text = new TextDecoder("windows-1250").decode(buffer);

        // Odstranimo morebitni začetni BOM.
        text = text.replace(/^\uFEFF/, "");

        // Preverjanje SRT strukture.
        const cues = (text.match(/-->/g) || []).length;

        if (cues === 0) {
            throw new Error("SRT časovne oznake niso bile prepoznane.");
        }

        // Predogled
        preview.value = text;

        const slovene =
            (text.match(/[čšžČŠŽ]/g) || []).length;

        details.textContent =
            `Kodiranje: Windows-1250 → UTF-8 · ` +
            `Podnapisov: ${cues} · ` +
            `Slovenskih šumnikov: ${slovene}`;

        // Ime nove datoteke
        const outputName =
            selectedFile.name.replace(/\.srt$/i, "") +
            "_FIXED.srt";

        // Shranjevanje kot UTF-8
        const blob = new Blob(
            ["\uFEFF", text],
            { type: "text/plain;charset=utf-8" }
        );

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.download = outputName;
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 2000);

        showStatus(
            "Uspešno pretvorjeno in preneseno: " + outputName,
            "success"
        );

    } catch (error) {
        showStatus("Napaka: " + error.message, "error");
    } finally {
        convertBtn.disabled = false;
    }

});

</script>
</body>
</html>
