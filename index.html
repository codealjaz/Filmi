<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iskanje filmov in slovenskih podnapisov</title>

  <style>
    body {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
      font: 16px Arial, sans-serif;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 4px 0;
    }

    input {
      width: min(100%, 380px);
    }

    button {
      cursor: pointer;
    }

    .film {
      border-top: 1px solid #ddd;
      padding: 14px 0;
    }

    .gumbi {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
  </style>
</head>

<body>

  <h1>Iskanje filmov</h1>

  <input
    id="iskanje"
    type="search"
    placeholder="Vpiši naslov filma"
  >

  <button id="isci">Išči</button>

  <div id="rezultat" aria-live="polite"></div>

  <script>
    const API_KLJUC = "8f7a42e2";

    const vnos = document.getElementById("iskanje");
    const rezultat = document.getElementById("rezultat");

    document.getElementById("isci")
      .addEventListener("click", isci);

    vnos.addEventListener("keydown", (dogodek) => {
      if (dogodek.key === "Enter") {
        isci();
      }
    });

    async function isci() {
      const naslov = vnos.value.trim();

      if (!naslov) {
        rezultat.textContent = "Vpiši naslov filma.";
        return;
      }

      rezultat.textContent = "Iščem filme ...";

      try {
        const url = new URL("https://www.omdbapi.com/");

        url.search = new URLSearchParams({
          apikey: API_KLJUC,
          s: naslov,
          type: "movie",
          r: "json"
        });

        const odgovor = await fetch(url);
        const podatki = await odgovor.json();

        if (podatki.Response === "False") {
          rezultat.textContent = "Filma nisem našel.";
          return;
        }

        rezultat.replaceChildren();

        for (const film of podatki.Search) {

          const kartica = document.createElement("section");
          kartica.className = "film";

          const naslovFilma = document.createElement("h2");
          naslovFilma.textContent =
            `${film.Title} (${film.Year})`;

          const gumbi = document.createElement("div");
          gumbi.className = "gumbi";

          // En skupni gumb za odpiranje obeh strani hkrati
          const skupniGumb = document.createElement("button");
          skupniGumb.textContent = "Odpri podnapise in Pirate Bay";

          skupniGumb.addEventListener("click", () => {
            // Hkrati sprožimo odpiranje obeh strani
            odpriPodnapise(film.imdbID);
            odpriPirateBay(film.Title, film.Year);
          });

          gumbi.append(skupniGumb);
          kartica.append(naslovFilma, gumbi);
          rezultat.appendChild(kartica);
        }

      } catch (napaka) {
        rezultat.textContent =
          "Pri iskanju je prišlo do napake. Poskusi znova.";

        console.error(napaka);
      }
    }

    // Funkcija za odpiranje slovenskih podnapisov
    function odpriPodnapise(imdbID) {
      const imdbStevilka = imdbID.replace(/^tt/, "");
      const naslov = vnos.value.trim();

      const povezava =
        "https://www.opensubtitles.org/en/search/" +
        `imdbid-${encodeURIComponent(imdbStevilka)}/` +
        "sublanguageid-slv/" +
        `moviename-${encodeURIComponent(naslov)}`;

      window.open(
        povezava,
        "_blank",
        "noopener,noreferrer"
      );
    }

    // Nova funkcija za odpiranje Pirate Bay po vašem vzorcu
    function odpriPirateBay(naslov, leto) {
      // Sestavimo niz "Naslov (Leto)" npr. "Tenet (2020)"
      const iskalniNiz = `${naslov} (${leto})`;
      
      const povezava =
        "https://thepiratebay.party/search/" +
        encodeURIComponent(iskalniNiz) +
        "/1/99/0";

      window.open(
        povezava,
        "_blank",
        "noopener,noreferrer"
      );
    }

  </script>

</body>
</html>
